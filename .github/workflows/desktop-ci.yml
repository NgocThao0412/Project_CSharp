name: Desktop WinForms CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build and package WinForms
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore ./src/src.csproj

      - name: Build Release
        run: dotnet build ./src/src.csproj --configuration Release --no-restore

      - name: Publish Windows x64 (framework-dependent)
        if: github.event_name != 'pull_request'
        run: dotnet publish ./src/src.csproj --configuration Release --runtime win-x64 --self-contained false --output ./publish

      - name: Upload Desktop build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Project-CSharp-WinForms-win-x64
          path: ./publish/
          if-no-files-found: error
          retention-days: 14
